<svg xmlns="http://www.w3.org/2000/svg" width="320" height="170" viewBox="0 0 320 170" preserveAspectRatio="xMidYMid meet" aria-label="Example: 550 5.1.1 is a hard bounce"><style>text{font-family:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;fill:#8a8f98}.t{fill:#f4f5f6}.t2{fill:#c9ccd1}.f{fill:#8f949c}.hx{fill:#a98bff}.big{font-family:"Inter Tight", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;font-weight:600;letter-spacing:-0.03em;fill:#fff}.h{fill:#a98bff}.hw{fill:#a98bff;fill-opacity:.22}.hw2{fill:#a98bff;fill-opacity:.1}.hs{stroke:#a98bff;fill:none}.ln{stroke:rgba(255,255,255,.11);fill:none}.ln3{stroke:rgba(255,255,255,.16);fill:none}.b1{fill:#131417}.b2{fill:#191a1e}.wk{fill:rgba(255,255,255,.025)}.ok{fill:#5fd3a0}.bad{fill:#ff7b6b}.tick{font-size:11px}</style><text x="16" y="32" class="big" text-anchor="start" style="font-size:26px">550 5.1.1</text><text x="16" y="54" class="f" text-anchor="start" style="font-size:12px">Gmail and Google Workspace</text><rect x="16" y="80" width="101.4" height="26" rx="13" class="hw"/><text x="26" y="97" class="bad" text-anchor="start" style="font-size:12px">Hard bounce</text><rect x="125.4" y="80" width="108.8" height="26" rx="13" class="b2"/><text x="135.4" y="97" class="t" text-anchor="start" style="font-size:12px">Suppress now</text><rect x="16" y="116" width="108.8" height="26" rx="13" class="b2"/><text x="26" y="133" class="t2" text-anchor="start" style="font-size:12px">Do not retry</text><rect x="132.8" y="116" width="131" height="26" rx="13" class="b2"/><text x="142.8" y="133" class="f" text-anchor="start" style="font-size:12px">high confidence</text></svg>