<svg xmlns="http://www.w3.org/2000/svg" width="320" height="170" viewBox="0 0 320 170" preserveAspectRatio="xMidYMid meet" aria-label="Example: $90.00 of $150.00 deductible; the receipt needs fixing"><style>text{font-family:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;fill:#8a8f98}.t{fill:#f4f5f6}.t2{fill:#c9ccd1}.f{fill:#8f949c}.hx{fill:#ff5fa8}.big{font-family:"Inter Tight", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;font-weight:600;letter-spacing:-0.03em;fill:#fff}.h{fill:#ff5fa8}.hw{fill:#ff5fa8;fill-opacity:.22}.hw2{fill:#ff5fa8;fill-opacity:.1}.hs{stroke:#ff5fa8;fill:none}.ln{stroke:rgba(255,255,255,.11);fill:none}.ln3{stroke:rgba(255,255,255,.16);fill:none}.b1{fill:#131417}.b2{fill:#191a1e}.wk{fill:rgba(255,255,255,.025)}.ok{fill:#5fd3a0}.bad{fill:#ff7b6b}.tick{font-size:11px}</style><rect x="60" y="8" width="200" height="156" rx="6" class="b2"/><text x="76" y="34" class="t" text-anchor="start" style="font-size:12px">Paid $150.00</text><text x="244" y="34" class="hx" text-anchor="end" style="font-size:12px">$90.00 deductible</text><rect x="76" y="54" width="12" height="12" rx="3" class="bad"/><text x="96" y="64" class="t2" text-anchor="start" style="font-size:12px">Value estimate</text><rect x="76" y="76" width="12" height="12" rx="3" class="bad"/><text x="96" y="86" class="t2" text-anchor="start" style="font-size:12px">Deductible limit</text><rect x="76" y="98" width="12" height="12" rx="3" class="bad"/><text x="96" y="108" class="t2" text-anchor="start" style="font-size:12px">No &quot;no goods&quot; line</text><rect x="76" y="120" width="12" height="12" rx="3" class="bad"/><text x="96" y="130" class="t2" text-anchor="start" style="font-size:12px">Not &quot;100% deductible&quot;</text><text x="76" y="152" class="f" text-anchor="start" style="font-size:12px">4 lines to fix</text></svg>