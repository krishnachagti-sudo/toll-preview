<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Count business days between two dates</title>
<style>:root{--bg:#fff;--fg:#1a1a1a;--mute:#5b5b5b;--line:#d9d9d9;--accent:#0b5cad}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#16181c;--fg:#f0f0f0;--mute:#a8adb5;--line:#343a42;--accent:#7db8f5}}
:root[data-theme=dark]{--bg:#16181c;--fg:#f0f0f0;--mute:#a8adb5;--line:#343a42;--accent:#7db8f5}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{display:block;padding:14px 16px;color:inherit;text-decoration:none;min-width:260px}
a.w:hover .big{text-decoration:underline}
.k{margin:0;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.big{margin:4px 0 2px;font-size:30px;font-weight:700;line-height:1.1}
.s{margin:0;color:var(--mute);font-size:13px}
.by{display:block;margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;color:var(--accent)}
form.w{display:block}
label{display:block;margin:8px 0 0;font-size:12px;color:var(--mute)}
input{width:100%;margin-top:2px;padding:6px 8px;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px}
button{margin-top:10px;padding:7px 12px;font:inherit;font-weight:600;color:var(--bg);background:var(--accent);border:0;border-radius:4px;cursor:pointer}
.by a{color:var(--accent)}</style>
<meta name="robots" content="noindex, nofollow">
</head>
<body>
<form class="w" method="get" action="https://krishnachagti-sudo.github.io/toll-preview/business-days/" target="_top">
<p class="k">Business days between two dates</p>
<input type="hidden" name="op" value="between"><input type="hidden" name="region" value="US">
<label>From<input type="date" name="start" value="2040-01-01" required></label>
<label>To<input type="date" name="end" required></label>
<button type="submit">Count them</button>
<span class="by">US federal holidays skipped. Opens the calculator by Endwise</span>
</form>
<div role="note" style="position:fixed;inset:auto 0 0 0;z-index:50;padding:8px 16px;background:#2a1d10;color:#f3dcc0;font:13px/1.4 system-ui,sans-serif;text-align:center;border-top:1px solid #6b4a24">Preview copy. Pages and worked examples are real; running paid tools, signing in, the API and AI agents need the live server.</div>
</body>
</html>
