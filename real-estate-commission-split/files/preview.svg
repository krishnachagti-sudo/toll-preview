<svg xmlns="http://www.w3.org/2000/svg" width="320" height="170" viewBox="0 0 320 170" preserveAspectRatio="xMidYMid meet" aria-label="Example: you net $8,100.00; $3,600.00 of a $20,000.00 cap paid"><style>text{font-family:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;fill:#8a8f98}.t{fill:#f4f5f6}.t2{fill:#c9ccd1}.f{fill:#8f949c}.hx{fill:#ff5fa8}.big{font-family:"Inter Tight", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;font-weight:600;letter-spacing:-0.03em;fill:#fff}.h{fill:#ff5fa8}.hw{fill:#ff5fa8;fill-opacity:.22}.hw2{fill:#ff5fa8;fill-opacity:.1}.hs{stroke:#ff5fa8;fill:none}.ln{stroke:rgba(255,255,255,.11);fill:none}.ln3{stroke:rgba(255,255,255,.16);fill:none}.b1{fill:#131417}.b2{fill:#191a1e}.wk{fill:rgba(255,255,255,.025)}.ok{fill:#5fd3a0}.bad{fill:#ff7b6b}.tick{font-size:11px}</style><text x="16" y="30" class="f" text-anchor="start" style="font-size:12px">You net</text><text x="16" y="68" class="big" text-anchor="start" style="font-size:34px">$8,100.00</text><text x="304" y="30" class="t2" text-anchor="end" style="font-size:12px">$12,000.00 side</text><rect x="16" y="100" width="288" height="14" rx="7" class="b2"/><rect x="16" y="100" width="51.8" height="14" rx="7" class="h"/><text x="16" y="136" class="t" text-anchor="start" style="font-size:12px">$3,600.00 toward the cap</text><text x="304" y="136" class="f" text-anchor="end" style="font-size:12px">$20,000.00</text><text x="16" y="158" class="f" text-anchor="start" style="font-size:12px">$16,400.00 left</text></svg>