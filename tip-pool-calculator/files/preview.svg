<svg xmlns="http://www.w3.org/2000/svg" width="320" height="170" viewBox="0 0 320 170" preserveAspectRatio="xMidYMid meet" aria-label="Example: $800.00 split between 5 people by hours worked"><style>text{font-family:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;fill:#8a8f98}.t{fill:#f4f5f6}.t2{fill:#c9ccd1}.f{fill:#8f949c}.hx{fill:#ff5fa8}.big{font-family:"Inter Tight", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;font-weight:600;letter-spacing:-0.03em;fill:#fff}.h{fill:#ff5fa8}.hw{fill:#ff5fa8;fill-opacity:.22}.hw2{fill:#ff5fa8;fill-opacity:.1}.hs{stroke:#ff5fa8;fill:none}.ln{stroke:rgba(255,255,255,.11);fill:none}.ln3{stroke:rgba(255,255,255,.16);fill:none}.b1{fill:#131417}.b2{fill:#191a1e}.wk{fill:rgba(255,255,255,.025)}.ok{fill:#5fd3a0}.bad{fill:#ff7b6b}.tick{font-size:11px}</style><text x="16" y="24" class="f" text-anchor="start" style="font-size:12px">Share by hours worked</text><rect x="16" y="34" width="288" height="1" rx="0" class="b2"/><text x="16" y="58" class="t2" text-anchor="start" style="font-size:12px">Ana, Server, 8 h</text><text x="304" y="58" class="t" text-anchor="end" style="font-size:12px">$206.45</text><text x="16" y="82" class="t2" text-anchor="start" style="font-size:12px">Ben, Server, 6.5 h</text><text x="304" y="82" class="t" text-anchor="end" style="font-size:12px">$167.74</text><text x="16" y="106" class="t2" text-anchor="start" style="font-size:12px">Cleo, Bartender, 7 h</text><text x="304" y="106" class="t" text-anchor="end" style="font-size:12px">$180.65</text><text x="16" y="130" class="f" text-anchor="start" style="font-size:12px">+2 more</text><text x="16" y="158" class="hx" text-anchor="start" style="font-size:12px">about $25.81 an hour</text><text x="304" y="158" class="big" text-anchor="end" style="font-size:16px">$800.00</text></svg>