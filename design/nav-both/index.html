<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Section nav: both, polished</title>
<style>
@font-face{font-family:IT;src:url("../../assets/fonts/inter-tight-latin.woff2") format("woff2");font-weight:100 900}
@font-face{font-family:IN;src:url("../../assets/fonts/inter-latin.woff2") format("woff2");font-weight:100 900}
:root{--bg:#08090a;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.13);--text:#f4f5f6;--text2:#c9ccd1;--muted:#8a8f98;--ember:#ff5a36;
  --spring:linear(0,.047,.157,.298,.448,.591,.716,.821,.903,.964,1.006,1.032,1.046,1.052,1.051,1.046,1.039,1.031,1.024,1.017,1.011,1.006,1.003,1,.999,.998,.997,.997,.998,.998,1);
  --soft:linear(0,.075,.23,.4,.555,.683,.782,.855,.907,.942,.966,.981,.99,.996,.999,1,1.001,1.001,1.001,1.001,1.001,1,1,1,1);
  --out:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 IN,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}

/* ---------- the bar ---------- */
.head{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:50;width:min(1100px,calc(100% - 24px))}
.unit{position:relative;border-radius:30px;
  background:linear-gradient(180deg,rgba(30,31,36,.8),rgba(15,16,19,.88));-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);
  border:1px solid rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 20px 50px -24px rgba(0,0,0,.9);
  transition:border-radius .5s var(--out),box-shadow .4s}
.head.wide .unit{border-radius:26px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 26px 60px -24px rgba(0,0,0,.95)}
.head.bump .unit{animation:bump .6s var(--spring)}
@keyframes bump{30%{transform:scale(.988)}65%{transform:scale(1.004)}}
.bar{position:relative;display:flex;align-items:center;gap:18px;height:60px;padding:0 10px 0 20px}
.logo{display:flex;align-items:center;gap:9px;font:650 19px IT;letter-spacing:-.02em;flex:none}
.logo svg{width:24px;height:24px;overflow:visible}
.logo .dot{transform-box:fill-box;transform-origin:center}
.head.bump .logo .dot{animation:dot .7s .1s var(--spring)}
@keyframes dot{35%{transform:scale(1.7)}}

/* The middle slot holds either the main links or, compact, Menu plus the section tabs. */
.slot{position:relative;flex:1;min-width:0;height:100%;display:flex;align-items:center}
.links{display:flex;gap:4px;font:500 15px IT;color:var(--text2)}
.links a{padding:8px 11px;border-radius:999px;transition:opacity .28s,transform .5s var(--spring),filter .3s,color .2s,background .2s;transition-delay:calc(var(--i,0) * 35ms)}
.links a:hover{color:#fff;background:rgba(255,255,255,.06)}
.compact{position:absolute;inset:0;display:flex;align-items:center;gap:8px;pointer-events:none}
.mbtn{flex:none;display:inline-flex;align-items:center;gap:6px;font:500 14px IT;color:var(--text2);background:rgba(255,255,255,.06);border:1px solid var(--line2);border-radius:999px;padding:7px 12px 7px 10px;cursor:pointer;
  opacity:0;transform:scale(.85);transition:opacity .25s,transform .5s var(--spring),background .2s,color .2s}
.mbtn:hover{background:rgba(255,255,255,.1);color:#fff}
.mbtn svg{width:15px;height:15px}
.mbtn svg path{transition:transform .4s var(--spring);transform-origin:center}
.mbtn:hover svg path:last-child{transform:scaleX(1.4) translateX(1px)}

/* Section tabs: a pill slides to the current one; hovering shows the dot. */
.tabs{position:relative;display:flex;gap:2px;align-items:center;font:500 14.5px IT;color:var(--text2);overflow-x:auto;scrollbar-width:none;padding:4px}
.tabs::-webkit-scrollbar{display:none}
.tabs a{position:relative;z-index:1;padding:7px 13px;border-radius:999px;white-space:nowrap;transition:color .25s,opacity .3s,transform .5s var(--spring),filter .3s;transition-delay:0s,calc(var(--i,0) * 35ms),calc(var(--i,0) * 35ms),calc(var(--i,0) * 35ms)}
.tabs a:hover,.tabs a.on{color:#fff}
.tabs a::after{content:"";position:absolute;left:50%;bottom:2px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ember);transform:scale(0);transition:transform .35s var(--spring)}
.tabs a:hover:not(.on)::after{transform:scale(1)}
.ind{position:absolute;z-index:0;top:4px;bottom:4px;left:0;width:0;border-radius:999px;background:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
  transition:transform .55s var(--spring),width .55s var(--spring),opacity .3s;opacity:0}
.ind.ready{opacity:1}
/* Each pill shows only while its row does: the slim row's while compact, the tray's while open. */
.compact .ind.ready,.tray .ind.ready{opacity:0}
.head.docked:not(.wide) .compact .ind.ready{opacity:1;transition-delay:.12s}
.head.wide .tray .ind.ready{opacity:1;transition-delay:.12s}
.compact .tabs{flex:1;min-width:0;-webkit-mask:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);mask:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
.compact .tabs a{opacity:0;transform:translateY(9px);filter:blur(3px)}

/* compact: docked and not opened */
.head.docked:not(.wide) .links a{opacity:0;transform:translateY(-9px);filter:blur(3px);pointer-events:none;transition-delay:calc(var(--i,0) * 25ms)}
.head.docked:not(.wide) .compact{pointer-events:auto}
.head.docked:not(.wide) .mbtn{opacity:1;transform:none;transition-delay:.06s}
.head.docked:not(.wide) .compact .tabs a{opacity:1;transform:none;filter:none;transition-delay:0s,calc(var(--i,0) * 35ms + 80ms),calc(var(--i,0) * 35ms + 80ms),calc(var(--i,0) * 35ms + 80ms)}

.search{flex:none;width:300px;display:flex;align-items:center;gap:8px;height:40px;padding:0 13px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);font:14px IN;overflow:hidden;cursor:text;
  transition:width .55s var(--soft),background .2s,border-color .2s}
.search:hover{border-color:rgba(255,255,255,.22)}
.search svg{width:16px;height:16px;flex:none;transition:transform .5s var(--spring)}
.search span{white-space:nowrap;transition:opacity .25s}
.head.docked:not(.wide) .search{width:40px}
.head.docked:not(.wide) .search span{opacity:0}
.head.docked:not(.wide) .search:hover svg{transform:rotate(-12deg) scale(1.08)}
.cta{flex:none;font:600 14.5px IT;background:#f4f5f6;color:#0b0c0e;border-radius:999px;padding:10px 16px;transition:transform .4s var(--spring),background .15s}
.cta:hover{background:#fff}.cta:active{transform:scale(.96)}

/* The tray grows on a real height animation (grid rows 0fr to 1fr). */
.tray{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s var(--soft)}
.tray-in{min-height:0;overflow:hidden;border-top:1px solid transparent;transition:border-color .4s}
.tray .tabs{justify-content:center;margin:0 10px;padding:4px 4px 8px}
.tray .tabs a{opacity:0;transform:translateY(-7px);filter:blur(2px)}
.head.wide .tray{grid-template-rows:1fr}
.head.wide .tray-in{border-top-color:rgba(255,255,255,.07)}
.head.wide .tray .tabs a{opacity:1;transform:none;filter:none;transition-delay:0s,calc(var(--i,0) * 30ms + 60ms),calc(var(--i,0) * 30ms + 60ms),calc(var(--i,0) * 30ms + 60ms)}
.tray .ind{top:4px;bottom:8px}

/* Reading progress rides the unit's lower rim, so it glides down when the tray opens. */
.progress{position:absolute;left:24px;right:24px;bottom:-1px;height:2px;border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--ember),#ff3d86);transform-origin:left;transform:scaleX(var(--p,0));transition:transform .15s linear}
.progress b{position:absolute;top:-2px;width:6px;height:6px;border-radius:50%;background:var(--ember);box-shadow:0 0 10px var(--ember);left:calc(var(--p,0) * 100% - 3px);opacity:0;transition:opacity .3s}
.head.docked .progress b{opacity:1}

/* ---------- the page ---------- */
.hero{max-width:820px;margin:0 auto;padding:150px 16px 30px;text-align:center}
.hero h1{font:650 clamp(34px,6vw,56px)/1.05 IT;letter-spacing:-.03em;margin:0 0 14px}
.hero p{color:var(--muted);margin:0}
.inpage{max-width:1000px;margin:26px auto 0;padding:0 16px;display:flex;justify-content:center;will-change:transform,opacity}
.inpage .tabs{border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.03)}
main{max-width:760px;margin:0 auto;padding:30px 16px 260px}
section{padding:64px 0 10px;scroll-margin-top:160px}
section h2{font:650 30px IT;letter-spacing:-.02em;margin:0 0 12px}
section p{color:var(--text2)}
.fake{height:180px;border-radius:16px;border:1px solid var(--line2);background:linear-gradient(135deg,#121317,#0d0e10);margin:18px 0}
.note{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:60;font:13px IT;color:var(--muted);background:rgba(20,21,24,.92);border:1px solid var(--line2);border-radius:999px;padding:8px 14px;white-space:nowrap}

/* ---------- phones: no room for one row, so docked is always the tray ---------- */
@media (max-width:760px){
  .links{display:none}
  .compact{display:none}
  .search{width:40px}.search span{opacity:0}
  .bar{gap:10px}
  .tray .tabs{justify-content:flex-start;-webkit-mask:linear-gradient(90deg,transparent,#000 12px,#000 calc(100% - 12px),transparent);mask:linear-gradient(90deg,transparent,#000 12px,#000 calc(100% - 12px),transparent)}
  .note{font-size:12px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="head" id="head">
  <div class="unit">
    <div class="bar">
      <a class="logo" href="#top" aria-label="Endwise home"><svg viewBox="0 0 24 24"><rect x="1" y="1" width="22" height="22" rx="6.5" fill="#f4f5f6"/><path d="M6 12h7.2" stroke="#0b0c0e" stroke-width="2.4" stroke-linecap="round"/><circle class="dot" cx="17.4" cy="12" r="1.9" fill="#ff5a36"/></svg>Endwise</a>
      <div class="slot">
        <nav class="links" aria-label="Main"><a href="#" style="--i:0">Tools</a><a href="#" style="--i:1">Pricing</a><a href="#" style="--i:2">Developers</a></nav>
        <div class="compact">
          <button class="mbtn" type="button" aria-label="Open the main menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h9"/></svg>Menu</button>
          <nav class="tabs" data-tabs aria-label="On this page"></nav>
        </div>
      </div>
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Search tools and answers</span></div>
      <a class="cta" href="#">Get started</a>
    </div>
    <div class="tray"><div class="tray-in"><nav class="tabs" data-tabs aria-label="On this page"></nav></div></div>
    <span class="progress" aria-hidden="true"><i></i><b></b></span>
  </div>
</header>

<div class="page">
  <div class="hero" id="top">
    <h1>How much of each payment to set aside</h1>
    <p>Scroll down to read: the bar slims to one row. Scroll up a little, hover the bar or press Menu: it opens.</p>
  </div>
  <div class="inpage" id="inpage"><nav class="tabs" data-tabs aria-label="On this page"></nav></div>
  <main id="main"></main>
</div>
<div class="note">Read down: one row. Reach up or hover: the full bar.</div>

<script>
(function () {
  var S = ['Calculator', 'Your year', 'How it is worked out', 'Prices', 'Set-aside by place and case', 'From code'];
  var head = document.getElementById('head'), inpage = document.getElementById('inpage');
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches, narrow = matchMedia('(max-width: 760px)');
  var copy = 'Each payment you get as a freelancer has tax in it that nobody withholds. This is placeholder text so the page is long enough to scroll; the real tool page has its own content here.';
  var main = document.getElementById('main');
  S.forEach(function (s, i) {
    var sec = document.createElement('section'); sec.id = 's' + i;
    sec.innerHTML = '<h2>' + s + '</h2><p>' + copy + '</p><div class="fake"></div><p>' + copy + '</p><p>' + copy + '</p>';
    main.appendChild(sec);
  });
  var navs = [].slice.call(document.querySelectorAll('[data-tabs]'));
  navs.forEach(function (nav) {
    var ind = document.createElement('span'); ind.className = 'ind'; nav.appendChild(ind); nav.ind = ind;
    S.forEach(function (s, i) { var a = document.createElement('a'); a.href = '#s' + i; a.textContent = s; a.style.setProperty('--i', i); nav.appendChild(a); });
  });

  // The pill slides to the current tab in every tab row; a hidden row is placed again when shown.
  function place(nav) {
    var on = nav.querySelector('a.on');
    if (!on || !on.offsetWidth) { nav.ind.classList.remove('ready'); return; }
    nav.ind.style.width = on.offsetWidth + 'px';
    nav.ind.style.transform = 'translateX(' + on.offsetLeft + 'px)';
    nav.ind.classList.add('ready');
    if (nav.scrollWidth > nav.clientWidth) nav.scrollTo({ left: on.offsetLeft - nav.clientWidth / 2 + on.offsetWidth / 2, behavior: reduce ? 'auto' : 'smooth' });
  }

  // Opening: scrolling up past a small threshold, the pointer on the bar, or Menu. Closing: scrolling
  // down past the threshold, or the pointer leaving (after a short grace), unless the visitor
  // scrolled up to open it.
  var lastY = scrollY, travel = 0, upward = false, hovering = false, leaveTimer = 0, docked = false, current = -1;
  // A pointer passing over the bar on its way elsewhere does not open it: it has to rest a moment.
  var enterTimer = 0;
  head.addEventListener('pointerenter', function (e) {
    if (e.pointerType !== 'mouse') return;
    clearTimeout(leaveTimer);
    enterTimer = setTimeout(function () { hovering = true; render(); }, 140);
  });
  head.addEventListener('pointerleave', function () {
    clearTimeout(enterTimer);
    leaveTimer = setTimeout(function () { hovering = false; render(); }, 380);
  });
  document.querySelector('.mbtn').addEventListener('click', function () { upward = true; render(); });

  function render() {
    var wide = docked && (narrow.matches || upward || hovering);
    if (head.classList.contains('wide') !== wide) {
      head.classList.toggle('wide', wide);
      setTimeout(function () { navs.forEach(place); }, 60);
    }
  }

  function tick() {
    var y = scrollY, dy = y - lastY; lastY = y;
    if ((dy > 0) !== (travel > 0)) travel = 0;
    travel += dy;
    if (travel < -28) upward = true; else if (travel > 28) upward = false;
    head.style.setProperty('--p', Math.min(1, y / Math.max(1, document.documentElement.scrollHeight - innerHeight)));

    // The in-page row rises into the bar as it reaches it.
    var top = inpage.getBoundingClientRect().top, k = Math.max(0, Math.min(1, (top - 84) / 110));
    inpage.style.opacity = reduce ? (k > 0 ? 1 : 0) : k;
    inpage.style.transform = 'translateY(' + (-(1 - k) * 14) + 'px) scale(' + (0.97 + k * 0.03) + ')';
    var nowDocked = top < 90;
    if (nowDocked !== docked) {
      docked = nowDocked;
      head.classList.toggle('docked', docked);
      if (docked && !reduce) { head.classList.remove('bump'); void head.offsetWidth; head.classList.add('bump'); }
      if (!docked) upward = false;
      setTimeout(function () { navs.forEach(place); }, 90);
    }
    render();

    var idx = 0;
    S.forEach(function (_, i) { if (document.getElementById('s' + i).getBoundingClientRect().top < 180) idx = i; });
    if (idx !== current) {
      current = idx;
      navs.forEach(function (nav) {
        [].forEach.call(nav.querySelectorAll('a'), function (a) { a.classList.toggle('on', a.getAttribute('href') === '#s' + idx); });
        place(nav);
      });
    }
  }
  var raf = 0;
  addEventListener('scroll', function () { if (!raf) raf = requestAnimationFrame(function () { raf = 0; tick(); }); }, { passive: true });
  addEventListener('resize', function () { navs.forEach(place); tick(); });
  narrow.addEventListener('change', render);
  tick();
  setTimeout(function () { navs.forEach(place); }, 100);
})();
</script>
</body>
</html>
