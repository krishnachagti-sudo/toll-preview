<svg xmlns="http://www.w3.org/2000/svg" width="320" height="170" viewBox="0 0 320 170" preserveAspectRatio="xMidYMid meet" aria-label="Example: de 123.456.789 read as DE123456789"><style>text{font-family:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;fill:#8a8f98}.t{fill:#f4f5f6}.t2{fill:#c9ccd1}.f{fill:#8f949c}.hx{fill:#ff5fa8}.big{font-family:"Inter Tight", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;font-weight:600;letter-spacing:-0.03em;fill:#fff}.h{fill:#ff5fa8}.hw{fill:#ff5fa8;fill-opacity:.22}.hw2{fill:#ff5fa8;fill-opacity:.1}.hs{stroke:#ff5fa8;fill:none}.ln{stroke:rgba(255,255,255,.11);fill:none}.ln3{stroke:rgba(255,255,255,.16);fill:none}.b1{fill:#131417}.b2{fill:#191a1e}.wk{fill:rgba(255,255,255,.025)}.ok{fill:#5fd3a0}.bad{fill:#ff7b6b}.tick{font-size:11px}</style><text x="16" y="26" class="f" text-anchor="start" style="font-size:12px">As typed</text><rect x="16" y="34" width="288" height="30" rx="6" class="b2"/><text x="28" y="54" class="t2" text-anchor="start" style="font-size:14px">de 123.456.789</text><path d="M160 70v14m-5-5 5 5 5-5" class="hs"/><text x="16" y="104" class="f" text-anchor="start" style="font-size:12px">As VIES reads it</text><rect x="16" y="112" width="288" height="30" rx="6" class="hw"/><text x="28" y="132" class="t" text-anchor="start" style="font-size:14px">DE123456789</text><text x="292" y="132" class="ok" text-anchor="end" style="font-size:12px">right shape</text><text x="16" y="162" class="f" text-anchor="start" style="font-size:12px">Germany · shape DE999999999</text></svg>