<svg xmlns="http://www.w3.org/2000/svg" width="320" height="170" viewBox="0 0 320 170" preserveAspectRatio="xMidYMid meet" aria-label="Example: 4 of 8 payees need a 1099"><style>text{font-family:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;fill:#8a8f98}.t{fill:#f4f5f6}.t2{fill:#c9ccd1}.f{fill:#8f949c}.hx{fill:#ff5fa8}.big{font-family:"Inter Tight", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;font-weight:600;letter-spacing:-0.03em;fill:#fff}.h{fill:#ff5fa8}.hw{fill:#ff5fa8;fill-opacity:.22}.hw2{fill:#ff5fa8;fill-opacity:.1}.hs{stroke:#ff5fa8;fill:none}.ln{stroke:rgba(255,255,255,.11);fill:none}.ln3{stroke:rgba(255,255,255,.16);fill:none}.b1{fill:#131417}.b2{fill:#191a1e}.wk{fill:rgba(255,255,255,.025)}.ok{fill:#5fd3a0}.bad{fill:#ff7b6b}.tick{font-size:11px}</style><text x="16" y="50" class="big" text-anchor="start" style="font-size:26px">4 of 8 payees</text><text x="16" y="72" class="f" text-anchor="start" style="font-size:12px">need a form at the $2,000 line</text><rect x="18" y="96" width="32" height="18" rx="4" class="h"/><rect x="54" y="96" width="32" height="18" rx="4" class="h"/><rect x="90" y="96" width="32" height="18" rx="4" class="h"/><rect x="126" y="96" width="32" height="18" rx="4" class="h"/><rect x="162" y="96" width="32" height="18" rx="4" class="b2"/><rect x="198" y="96" width="32" height="18" rx="4" class="b2"/><rect x="234" y="96" width="32" height="18" rx="4" class="b2"/><rect x="270" y="96" width="32" height="18" rx="4" class="b2"/><text x="16" y="140" class="hx" text-anchor="start" style="font-size:12px">2 1099-NEC · 3 1099-MISC</text><text x="16" y="160" class="f" text-anchor="start" style="font-size:12px">2026 payments</text></svg>