<svg xmlns="http://www.w3.org/2000/svg" width="320" height="170" viewBox="0 0 320 170" preserveAspectRatio="xMidYMid meet" aria-label="Example: &quot;10 business days after next Friday&quot; is Monday, November 23, 2026"><style>text{font-family:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;fill:#8a8f98}.t{fill:#f4f5f6}.t2{fill:#c9ccd1}.f{fill:#8f949c}.hx{fill:#ffb547}.big{font-family:"Inter Tight", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;font-weight:600;letter-spacing:-0.03em;fill:#fff}.h{fill:#ffb547}.hw{fill:#ffb547;fill-opacity:.22}.hw2{fill:#ffb547;fill-opacity:.1}.hs{stroke:#ffb547;fill:none}.ln{stroke:rgba(255,255,255,.11);fill:none}.ln3{stroke:rgba(255,255,255,.16);fill:none}.b1{fill:#131417}.b2{fill:#191a1e}.wk{fill:rgba(255,255,255,.025)}.ok{fill:#5fd3a0}.bad{fill:#ff7b6b}.tick{font-size:11px}</style><text x="16" y="20" class="f" text-anchor="start" style="font-size:12px">&quot;10 business days after next Friday&quot;</text><rect x="16" y="32" width="288" height="30" rx="15" class="hw"/><text x="30" y="52" class="t2" text-anchor="start" style="font-size:12px">resolves to</text><text x="290" y="52" class="t" text-anchor="end" style="font-size:12px">Mon, Nov 23</text><rect x="16" y="70" width="288" height="30" rx="15" class="b2"/><text x="30" y="90" class="t2" text-anchor="start" style="font-size:12px">next week reading</text><text x="290" y="90" class="t2" text-anchor="end" style="font-size:12px">Mon, Nov 30</text><rect x="16" y="108" width="288" height="30" rx="15" class="b1"/><text x="30" y="128" class="t2" text-anchor="start" style="font-size:12px">skips Veterans Day</text><text x="290" y="128" class="f" text-anchor="end" style="font-size:12px">Wed, Nov 11</text><text x="16" y="160" class="f" text-anchor="start" style="font-size:12px">said on Mon, Nov 2, 2026</text></svg>