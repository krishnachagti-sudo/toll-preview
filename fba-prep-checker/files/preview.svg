<svg xmlns="http://www.w3.org/2000/svg" width="320" height="170" viewBox="0 0 320 170" preserveAspectRatio="xMidYMid meet" aria-label="Example: Cotton T-shirt, size M: Bag clear, 1.5 mil+, Suffocation warning 10 pt+, FNSKU label yes, Size tier Large standard"><style>text{font-family:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;fill:#8a8f98}.t{fill:#f4f5f6}.t2{fill:#c9ccd1}.f{fill:#8f949c}.hx{fill:#45d3ff}.big{font-family:"Inter Tight", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;font-weight:600;letter-spacing:-0.03em;fill:#fff}.h{fill:#45d3ff}.hw{fill:#45d3ff;fill-opacity:.22}.hw2{fill:#45d3ff;fill-opacity:.1}.hs{stroke:#45d3ff;fill:none}.ln{stroke:rgba(255,255,255,.11);fill:none}.ln3{stroke:rgba(255,255,255,.16);fill:none}.b1{fill:#131417}.b2{fill:#191a1e}.wk{fill:rgba(255,255,255,.025)}.ok{fill:#5fd3a0}.bad{fill:#ff7b6b}.tick{font-size:11px}</style><text x="16" y="40" class="big" text-anchor="start" style="font-size:16px">Cotton T-shirt, size M</text><text x="16" y="72" class="t2" text-anchor="start" style="font-size:12px">Bag</text><text x="304" y="72" class="hx" text-anchor="end" style="font-size:12px">clear, 1.5 mil+</text><text x="16" y="97" class="t2" text-anchor="start" style="font-size:12px">Suffocation warning</text><text x="304" y="97" class="hx" text-anchor="end" style="font-size:12px">10 pt+</text><text x="16" y="122" class="t2" text-anchor="start" style="font-size:12px">FNSKU label</text><text x="304" y="122" class="hx" text-anchor="end" style="font-size:12px">yes</text><text x="16" y="147" class="t2" text-anchor="start" style="font-size:12px">Size tier</text><text x="304" y="147" class="t" text-anchor="end" style="font-size:12px">Large standard</text><path d="M16 50 H304" class="ln3" stroke-dasharray="3 3"/></svg>