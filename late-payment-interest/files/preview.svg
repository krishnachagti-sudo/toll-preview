<svg xmlns="http://www.w3.org/2000/svg" width="320" height="170" viewBox="0 0 320 170" preserveAspectRatio="xMidYMid meet" aria-label="Example: £167.35 claimable on a £4,800.00 invoice paid 63 days late"><style>text{font-family:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;fill:#8a8f98}.t{fill:#f4f5f6}.t2{fill:#c9ccd1}.f{fill:#8f949c}.hx{fill:#ff5fa8}.big{font-family:"Inter Tight", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;font-weight:600;letter-spacing:-0.03em;fill:#fff}.h{fill:#ff5fa8}.hw{fill:#ff5fa8;fill-opacity:.22}.hw2{fill:#ff5fa8;fill-opacity:.1}.hs{stroke:#ff5fa8;fill:none}.ln{stroke:rgba(255,255,255,.11);fill:none}.ln3{stroke:rgba(255,255,255,.16);fill:none}.b1{fill:#131417}.b2{fill:#191a1e}.wk{fill:rgba(255,255,255,.025)}.ok{fill:#5fd3a0}.bad{fill:#ff7b6b}.tick{font-size:11px}</style><text x="16" y="44" class="big" text-anchor="start" style="font-size:28px">£167.35</text><text x="16" y="66" class="f" text-anchor="start" style="font-size:12px">on £4,800.00, 63 days late</text><rect x="96" y="78" width="208" height="92" rx="6" class="b1"/><rect x="110" y="90" width="70" height="6" rx="2" class="b2"/><rect x="110" y="100" width="110" height="6" rx="2" class="b2"/><text x="110" y="124" class="f" text-anchor="start" style="font-size:12px">Interest</text><text x="292" y="124" class="t2" text-anchor="end" style="font-size:12px">£97.35</text><text x="110" y="142" class="f" text-anchor="start" style="font-size:12px">Compensation</text><text x="292" y="142" class="t2" text-anchor="end" style="font-size:12px">£70</text><line x1="110" x2="292" y1="150" y2="150" class="ln3"/><text x="110" y="164" class="f" text-anchor="start" style="font-size:12px">at 11.75%</text><text x="292" y="164" class="hx" text-anchor="end" style="font-size:12px">£167.35</text></svg>