<svg xmlns="http://www.w3.org/2000/svg" width="320" height="170" viewBox="0 0 320 170" preserveAspectRatio="xMidYMid meet" aria-label="Example: 7 codes: 4 to fix, 2 to review, 1 clear"><style>text{font-family:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;fill:#8a8f98}.t{fill:#f4f5f6}.t2{fill:#c9ccd1}.f{fill:#8f949c}.hx{fill:#45d3ff}.big{font-family:"Inter Tight", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;font-weight:600;letter-spacing:-0.03em;fill:#fff}.h{fill:#45d3ff}.hw{fill:#45d3ff;fill-opacity:.22}.hw2{fill:#45d3ff;fill-opacity:.1}.hs{stroke:#45d3ff;fill:none}.ln{stroke:rgba(255,255,255,.11);fill:none}.ln3{stroke:rgba(255,255,255,.16);fill:none}.b1{fill:#131417}.b2{fill:#191a1e}.wk{fill:rgba(255,255,255,.025)}.ok{fill:#5fd3a0}.bad{fill:#ff7b6b}.tick{font-size:11px}</style><text x="16" y="46" class="big" text-anchor="start" style="font-size:26px">7 codes checked</text><text x="16" y="68" class="f" text-anchor="start" style="font-size:12px">against the GS1 certificate</text><rect x="16" y="84" width="150" height="22" rx="11" class="b2"/><rect x="26" y="91" width="8" height="8" rx="4" class="bad"/><text x="42" y="99" class="t" text-anchor="start" style="font-size:12px">4 fix first</text><rect x="16" y="112" width="150" height="22" rx="11" class="b2"/><rect x="26" y="119" width="8" height="8" rx="4" class="h"/><text x="42" y="127" class="t" text-anchor="start" style="font-size:12px">2 review</text><rect x="16" y="140" width="150" height="22" rx="11" class="b2"/><rect x="26" y="147" width="8" height="8" rx="4" class="ok"/><text x="42" y="155" class="t" text-anchor="start" style="font-size:12px">1 clear</text><text x="304" y="150" class="f" text-anchor="end" style="font-size:12px">614141000012</text></svg>