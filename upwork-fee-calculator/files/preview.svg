<svg xmlns="http://www.w3.org/2000/svg" width="320" height="170" viewBox="0 0 320 170" preserveAspectRatio="xMidYMid meet" aria-label="Example: $800.00 billed, $720.00 left to withdraw"><style>text{font-family:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;fill:#8a8f98}.t{fill:#f4f5f6}.t2{fill:#c9ccd1}.f{fill:#8f949c}.hx{fill:#ff5fa8}.big{font-family:"Inter Tight", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;font-weight:600;letter-spacing:-0.03em;fill:#fff}.h{fill:#ff5fa8}.hw{fill:#ff5fa8;fill-opacity:.22}.hw2{fill:#ff5fa8;fill-opacity:.1}.hs{stroke:#ff5fa8;fill:none}.ln{stroke:rgba(255,255,255,.11);fill:none}.ln3{stroke:rgba(255,255,255,.16);fill:none}.b1{fill:#131417}.b2{fill:#191a1e}.wk{fill:rgba(255,255,255,.025)}.ok{fill:#5fd3a0}.bad{fill:#ff7b6b}.tick{font-size:11px}</style><rect x="54" y="14" width="212" height="156" rx="6" class="b2"/><text x="70" y="40" class="t2" text-anchor="start" style="font-size:12px">Billed</text><text x="250" y="40" class="t" text-anchor="end" style="font-size:12px">$800.00</text><text x="70" y="62" class="t2" text-anchor="start" style="font-size:12px">Service fee 10%</text><text x="250" y="62" class="bad" text-anchor="end" style="font-size:12px">-$80.00</text><text x="70" y="84" class="t2" text-anchor="start" style="font-size:12px">Withdrawal fee</text><text x="250" y="84" class="f" text-anchor="end" style="font-size:12px">not entered</text><rect x="70" y="98" width="180" height="1" rx="0" class="b1"/><text x="70" y="122" class="f" text-anchor="start" style="font-size:12px">Left to withdraw</text><text x="250" y="148" class="big" text-anchor="end" style="font-size:20px">$720.00</text></svg>