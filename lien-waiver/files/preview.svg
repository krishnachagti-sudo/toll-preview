<svg xmlns="http://www.w3.org/2000/svg" width="320" height="170" viewBox="0 0 320 170" preserveAspectRatio="xMidYMid meet" aria-label="Example: Texas: conditional waiver, progress payment, notarized"><style>text{font-family:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;fill:#8a8f98}.t{fill:#f4f5f6}.t2{fill:#c9ccd1}.f{fill:#8f949c}.hx{fill:#45d3ff}.big{font-family:"Inter Tight", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;font-weight:600;letter-spacing:-0.03em;fill:#fff}.h{fill:#45d3ff}.hw{fill:#45d3ff;fill-opacity:.22}.hw2{fill:#45d3ff;fill-opacity:.1}.hs{stroke:#45d3ff;fill:none}.ln{stroke:rgba(255,255,255,.11);fill:none}.ln3{stroke:rgba(255,255,255,.16);fill:none}.b1{fill:#131417}.b2{fill:#191a1e}.wk{fill:rgba(255,255,255,.025)}.ok{fill:#5fd3a0}.bad{fill:#ff7b6b}.tick{font-size:11px}</style><text x="16" y="46" class="big" text-anchor="start" style="font-size:24px">Conditional</text><text x="16" y="68" class="t2" text-anchor="start" style="font-size:12px">waiver,</text><text x="16" y="88" class="t2" text-anchor="start" style="font-size:12px">progress payment</text><text x="16" y="116" class="f" text-anchor="start" style="font-size:12px">Texas form</text><text x="16" y="148" class="hx" text-anchor="start" style="font-size:12px">Notary required</text><rect x="192" y="18" width="112" height="140" rx="6" class="b2"/><text x="206" y="44" class="t" text-anchor="start" style="font-size:12px">TX</text><rect x="206" y="66" width="84" height="4" rx="2" class="b1"/><rect x="206" y="78" width="84" height="4" rx="2" class="b1"/><rect x="206" y="90" width="84" height="4" rx="2" class="b1"/><rect x="206" y="102" width="50" height="4" rx="2" class="b1"/><rect x="206" y="122" width="84" height="22" rx="4" class="hw"/><text x="248" y="137" class="t" text-anchor="middle" style="font-size:12px">Notary</text></svg>