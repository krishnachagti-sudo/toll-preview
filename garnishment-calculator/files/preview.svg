<svg xmlns="http://www.w3.org/2000/svg" width="320" height="170" viewBox="0 0 320 170" preserveAspectRatio="xMidYMid meet" aria-label="Example: withhold $152.64 from a CA paycheck"><style>text{font-family:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;fill:#8a8f98}.t{fill:#f4f5f6}.t2{fill:#c9ccd1}.f{fill:#8f949c}.hx{fill:#ff5fa8}.big{font-family:"Inter Tight", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;font-weight:600;letter-spacing:-0.03em;fill:#fff}.h{fill:#ff5fa8}.hw{fill:#ff5fa8;fill-opacity:.22}.hw2{fill:#ff5fa8;fill-opacity:.1}.hs{stroke:#ff5fa8;fill:none}.ln{stroke:rgba(255,255,255,.11);fill:none}.ln3{stroke:rgba(255,255,255,.16);fill:none}.b1{fill:#131417}.b2{fill:#191a1e}.wk{fill:rgba(255,255,255,.025)}.ok{fill:#5fd3a0}.bad{fill:#ff7b6b}.tick{font-size:11px}</style><text x="16" y="44" class="t2" text-anchor="start" style="font-size:13px">Disposable earnings</text><text x="304" y="44" class="t" text-anchor="end" style="font-size:13px">$2,379.00</text><text x="16" y="71" class="t2" text-anchor="start" style="font-size:13px">Federal limit</text><text x="304" y="71" class="t" text-anchor="end" style="font-size:13px">$594.75</text><text x="16" y="98" class="t2" text-anchor="start" style="font-size:13px">California limit</text><text x="304" y="98" class="t" text-anchor="end" style="font-size:13px">$302.64</text><text x="16" y="125" class="t2" text-anchor="start" style="font-size:13px">Already withheld</text><text x="304" y="125" class="t" text-anchor="end" style="font-size:13px">-$150.00</text><path d="M16 135 H304" class="ln3" stroke-dasharray="3 3"/><text x="16" y="152" class="hx" text-anchor="start" style="font-size:14px">Withheld for this order</text><text x="304" y="152" class="big" text-anchor="end" style="font-size:18px">$152.64</text></svg>