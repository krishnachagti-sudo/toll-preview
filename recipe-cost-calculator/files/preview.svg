<svg xmlns="http://www.w3.org/2000/svg" width="320" height="170" viewBox="0 0 320 170" preserveAspectRatio="xMidYMid meet" aria-label="Example: Pan-seared salmon per portion went from $5.15 to $6.09"><style>text{font-family:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;fill:#8a8f98}.t{fill:#f4f5f6}.t2{fill:#c9ccd1}.f{fill:#8f949c}.hx{fill:#ff5fa8}.big{font-family:"Inter Tight", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;font-weight:600;letter-spacing:-0.03em;fill:#fff}.h{fill:#ff5fa8}.hw{fill:#ff5fa8;fill-opacity:.22}.hw2{fill:#ff5fa8;fill-opacity:.1}.hs{stroke:#ff5fa8;fill:none}.ln{stroke:rgba(255,255,255,.11);fill:none}.ln3{stroke:rgba(255,255,255,.16);fill:none}.b1{fill:#131417}.b2{fill:#191a1e}.wk{fill:rgba(255,255,255,.025)}.ok{fill:#5fd3a0}.bad{fill:#ff7b6b}.tick{font-size:11px}</style><text x="16" y="28" class="t" text-anchor="start" style="font-size:12px">Pan-seared salmon</text><rect x="16" y="46" width="120" height="70" rx="8" class="b2"/><text x="30" y="70" class="f" text-anchor="start" style="font-size:12px">Was</text><text x="30" y="102" class="big" text-anchor="start" style="font-size:24px">$5.15</text><text x="160" y="88" class="f" text-anchor="middle" style="font-size:16px">→</text><rect x="184" y="46" width="120" height="70" rx="8" class="hw"/><text x="198" y="70" class="f" text-anchor="start" style="font-size:12px">Now</text><text x="198" y="102" class="big" text-anchor="start" style="font-size:24px">$6.09</text><text x="16" y="146" class="t2" text-anchor="start" style="font-size:12px">32.1% food cost, target 30%</text></svg>